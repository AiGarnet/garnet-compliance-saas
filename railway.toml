[build]
builder = "DOCKERFILE"
dockerfile = "Dockerfile"

[deploy]
runtime = "V2"
numReplicas = 1
sleepApplication = false
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
startCommand = "node dist/main.js"

[env]
NODE_ENV = "production"
PORT = "8080"

# NestJS specific configuration
[healthcheck]
path = "/health"
timeout = 10
interval = 30 