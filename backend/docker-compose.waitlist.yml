version: '3.8'

# Note: For production, this service is deployed at:
# https://garnet-compliance-saas-production.up.railway.app/
# This docker-compose file is for local development only.

services:
  waitlist-server:
    build:
      context: .
      dockerfile: Dockerfile.waitlist
    ports:
      - "3001:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/waitlist
      - PORT=3000
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - waitlist-network

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=waitlist
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - waitlist-network
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  waitlist-network:
    driver: bridge 