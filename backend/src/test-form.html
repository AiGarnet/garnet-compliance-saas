<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GARNET Waitlist Test Form</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      line-height: 1.6;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      color: #333;
    }
    h1 {
      color: #6b46c1;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
    }
    input, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 16px;
    }
    select {
      height: 42px;
    }
    .required:after {
      content: " *";
      color: #e53e3e;
    }
    button {
      background: linear-gradient(to right, #6b46c1, #d53f8c);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    button:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }
    .success {
      background-color: #d4edda;
      color: #155724;
      padding: 15px;
      border-radius: 4px;
      margin: 20px 0;
    }
    .error {
      background-color: #f8d7da;
      color: #721c24;
      padding: 15px;
      border-radius: 4px;
      margin: 20px 0;
    }
    .hidden {
      display: none;
    }
    pre {
      background: #f8f9fa;
      padding: 15px;
      border-radius: 4px;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <h1>GARNET Waitlist Test Form</h1>
  
  <div id="message" class="hidden"></div>
  
  <form id="waitlist-form">
    <div class="form-group">
      <label for="full_name" class="required">Full Name</label>
      <input 
        type="text" 
        id="full_name" 
        name="full_name" 
        required
        autocomplete="name"
        placeholder="Enter your full name"
      >
    </div>
    
    <div class="form-group">
      <label for="email" class="required">Email Address</label>
      <input 
        type="email" 
        id="email" 
        name="email" 
        required
        autocomplete="email"
        placeholder="Enter your email"
      >
    </div>
    
    <div class="form-group">
      <label for="password" class="required">Password</label>
      <input 
        type="password" 
        id="password" 
        name="password" 
        required
        autocomplete="new-password"
        placeholder="Create a password"
      >
    </div>
    
    <div class="form-group">
      <label for="role" class="required">Your Role</label>
      <select 
        id="role" 
        name="role" 
        required
        autocomplete="organization-title"
      >
        <option value="">Select your role</option>
        <option value="CISO">CISO</option>
        <option value="Security Engineer">Security Engineer</option>
        <option value="Compliance Officer">Compliance Officer</option>
        <option value="IT Manager">IT Manager</option>
        <option value="DevOps Engineer">DevOps Engineer</option>
        <option value="Product Manager">Product Manager</option>
        <option value="CTO">CTO</option>
        <option value="CEO">CEO</option>
        <option value="Founder">Founder</option>
        <option value="Other">Other</option>
      </select>
    </div>
    
    <div class="form-group">
      <label for="organization">Organization</label>
      <input 
        type="text" 
        id="organization" 
        name="organization"
        autocomplete="organization"
        placeholder="Your company name (optional)"
      >
    </div>
    
    <button type="submit">Join Waitlist</button>
  </form>
  
  <div id="response" class="hidden">
    <h3>API Response:</h3>
    <pre id="response-data"></pre>
  </div>
  
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('waitlist-form');
      const message = document.getElementById('message');
      const responseContainer = document.getElementById('response');
      const responseData = document.getElementById('response-data');
      
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        
        // Clear previous messages
        message.className = 'hidden';
        responseContainer.className = 'hidden';
        
        // Get form data
        const formData = {
          full_name: document.getElementById('full_name').value,
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
          role: document.getElementById('role').value,
          organization: document.getElementById('organization').value || null
        };
        
        // Show loading state
        const submitButton = form.querySelector('button[type="submit"]');
        const originalButtonText = submitButton.textContent;
        submitButton.textContent = 'Submitting...';
        submitButton.disabled = true;
        
        try {
          // API endpoint
          const apiUrl = 'https://garnet-compliance-saas-production.up.railway.app/join-waitlist';
          
          console.log('Submitting form data:', formData);
          
          // Make the API request
          const response = await fetch(apiUrl, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify(formData),
          });
          
          // Parse the JSON response
          const data = await response.json();
          
          // Display full response for debugging
          responseContainer.className = '';
          responseData.textContent = JSON.stringify(data, null, 2);
          
          if (!response.ok) {
            // Show error message
            message.className = 'error';
            message.textContent = data.error || 'Failed to join waitlist';
          } else {
            // Show success message
            message.className = 'success';
            message.textContent = data.message || 'Successfully joined the waitlist!';
            
            // Reset form on success
            form.reset();
          }
        } catch (error) {
          console.error('Waitlist submission error:', error);
          
          // Show error message
          message.className = 'error';
          message.textContent = error.message || 'An unexpected error occurred';
          
          // Display error details
          responseContainer.className = '';
          responseData.textContent = error.stack || error.toString();
        } finally {
          // Reset button state
          submitButton.disabled = false;
          submitButton.textContent = originalButtonText;
        }
      });
    });
  </script>
</body>
</html>
