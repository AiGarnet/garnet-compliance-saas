[build]
  base = "/"
  command = "bash ./netlify/build-simple.sh"
  publish = "frontend/out"
  functions = "netlify/functions"
  
[build.environment]
  NODE_VERSION = "20"
  NPM_VERSION = "10"
  # Make sure the URL is correct and accessible from the browser
  NEXT_PUBLIC_CHATBOT_URL = "https://garnet-compliance-saas-production.up.railway.app"
  # Add the Netlify URL as an environment variable that will be available at build time
  NETLIFY_URL = "https://testinggarnet.netlify.app"
  NEXT_TELEMETRY_DISABLED = "1"
  NEXT_PUBLIC_API_BASE_URL = "https://garnet-compliance-saas-production.up.railway.app/api"
  NEXT_STATIC_EXPORT = "true"

# Define the specific functions to deploy
[functions]
  directory = "netlify/functions"
  included_files = ["netlify/functions/*.js", "netlify/functions/package.json"]
  excluded_files = ["netlify/functions/node_modules/**", "netlify/functions/*.ts"]

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[plugins]]
  package = "@netlify/plugin-functions-install-core"

[[headers]]
  for = "/*"
    [headers.values]
    Access-Control-Allow-Origin = "https://garnet-compliance-saas-production.up.railway.app"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Origin, X-Requested-With, Content-Type, Accept"

# Redirects to the Railway backend - Added fallback behavior
[[redirects]]
  from = "/ask"
  to = "https://garnet-compliance-saas-production.up.railway.app/ask"
  status = 200
  force = true
  headers = {Access-Control-Allow-Origin = "*", Access-Control-Allow-Methods = "GET, POST, OPTIONS", Access-Control-Allow-Headers = "Origin, X-Requested-With, Content-Type, Accept"}
  # Add fallback to a placeholder response if the Railway backend is down
  conditions = {Role = ["visitor"]}

# Fallback function when Railway backend is unavailable
[[redirects]]
  from = "/ask-fallback"
  to = "/.netlify/functions/chatbot-fallback"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://garnet-compliance-saas-production.up.railway.app/api/:splat"
  status = 200
  force = true
  headers = {Access-Control-Allow-Origin = "*", Access-Control-Allow-Methods = "GET, POST, OPTIONS", Access-Control-Allow-Headers = "Origin, X-Requested-With, Content-Type, Accept"}

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
