[build]
  base = "."
  command = "bash ./netlify/build-simple.sh"
  publish = "frontend/out"

[build.environment]
  NODE_VERSION = "18.20.8"
  NPM_VERSION = "10.9.2"
  NEXT_PUBLIC_CHATBOT_URL = "https://garnet-compliance-saas-production.up.railway.app"
  NETLIFY_URL = "https://testinggarnet.netlify.app"
  NEXT_TELEMETRY_DISABLED = "1"
  NEXT_STATIC_EXPORT = "true"
  NEXT_PUBLIC_API_BASE_URL = "/api"

[functions]
  directory = "netlify/functions"
  included_files = ["netlify/functions/*.js", "netlify/functions/package.json"]

# Remove Next.js plugin as we're doing a static export
# [[plugins]]
#  package = "@netlify/plugin-nextjs"

[[plugins]]
  package = "@netlify/plugin-functions-install-core"

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Origin, X-Requested-With, Content-Type, Accept, Authorization"

# Proxy all /api requests to the Railway backend
[[redirects]]
  from = "/api/*"
  to = "https://garnet-compliance-saas-production.up.railway.app/api/:splat"
  status = 200
  force = true
  headers = {Access-Control-Allow-Origin = "*", Access-Control-Allow-Methods = "GET, POST, OPTIONS", Access-Control-Allow-Headers = "Origin, X-Requested-With, Content-Type, Accept"}

# Proxy specific endpoints
[[redirects]]
  from = "/ask"
  to = "https://garnet-compliance-saas-production.up.railway.app/ask"
  status = 200
  force = true
  headers = {Access-Control-Allow-Origin = "*", Access-Control-Allow-Methods = "GET, POST, OPTIONS", Access-Control-Allow-Headers = "Origin, X-Requested-With, Content-Type, Accept"}

[[redirects]]
  from = "/ask-fallback"
  to = "/.netlify/functions/chatbot-fallback"
  status = 200
  force = true

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
